    <style>
      html { -webkit-text-size-adjust: 100%; }
      body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
      input, textarea, select { font-size: max(16px, 1em); } /* iOS 输入框小于16px会自动放大页面 */
      .rsw-tip { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 9999; width: min(calc(100% - 24px), 396px); box-sizing: border-box; padding: 14px 16px; border-radius: 18px; background: #1d1d1f; color: #fff; font: 14px/1.5 -apple-system, sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
      .rsw-tip b { display: block; font-size: 15px; margin-bottom: 4px; }
      .rsw-tip button { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: #aaa; font-size: 20px; padding: 4px 8px; }
    </style>

    <script>
      /* 网页版（iPhone）适配 */
      (function () {
        var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
        var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
        /* iOS 的网页通知只能经 Service Worker 发出 */
        try {
          var N = window.Notification;
          if (N && "serviceWorker" in navigator) {
            var W = function (title, opt) { navigator.serviceWorker.ready.then(function (r) { r.showNotification(title, Object.assign({ icon: "icon-192.png" }, opt || {})); }).catch(function () {}); };
            W.requestPermission = function (cb) { return N.requestPermission(cb); };
            Object.defineProperty(W, "permission", { get: function () { return N.permission; } });
            window.Notification = W;
          }
        } catch (e) {}
        /* 安卓专属的设置项在网页版隐藏 */
        function hide() {
          ["s-nset", "s-test"].forEach(function (id) { var el = document.getElementById(id); if (el) el.style.display = "none"; });
          if (!navigator.vibrate) { var v = document.getElementById("rsf-vib"); if (v && v.closest) { var l = v.closest("label"); if (l) l.style.display = "none"; } }
          document.querySelectorAll("button, .rs-li").forEach(function (b) { if (/检查更新/.test(b.textContent || "") && !b.__rsw) { b.__rsw = 1; b.style.display = "none"; } });
        }
        new MutationObserver(hide).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener("DOMContentLoaded", hide);
        /* 在 Safari 里直接打开时，提示添加到主屏幕 */
        if (ios && !standalone && !localStorage.getItem("rsw-tip-off")) {
          document.addEventListener("DOMContentLoaded", function () {
            var d = document.createElement("div"); d.className = "rsw-tip";
            d.innerHTML = '<button type="button" aria-label="关闭">×</button><b>添加到主屏幕，像 App 一样用</b>点 Safari 底部的分享按钮（方框带向上箭头），往下找「添加到主屏幕」。';
            d.querySelector("button").onclick = function () { d.remove(); localStorage.setItem("rsw-tip-off", "1"); };
            document.body.appendChild(d);
          });
        }
        window.__rsgxWebVer = "0.5.13";
      })();
    </script>

    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <link rel="stylesheet" href="hark-charts.css" />
    <style>
      .x-app { width: 100%; max-width: 420px; justify-self: center; padding-bottom: 120px; display: grid; gap: 20px; }
      .x-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 8px; }
      .x-top__date { font: var(--type-label); color: var(--text-secondary); }
      .x-top h1 { font: var(--type-title); margin-top: 4px; }
      .x-top__line { font: var(--type-small); color: var(--text-secondary); margin-top: 6px; }
      .x-icon-btn { flex: none; width: var(--tap); height: var(--tap); display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--fill-tertiary); color: var(--text-primary); cursor: pointer; }
      .x-icon-btn:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-icon-btn svg { width: 20px; height: 20px; }

      .x-top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0 8px; align-items: center; }
      .x-top__text { display: contents; }
      .x-top__text > * { grid-column: 1; }
      .x-top #open-settings { grid-column: 3; grid-row: 1 / span 2; align-self: start; }
      .x-top__prog { grid-column: 2; grid-row: 1 / span 3; align-self: center; display: flex; align-items: center; }
      .x-top__prog[hidden] { display: none; }
      .x-ring { flex: none; width: 80px; height: 80px; position: relative; }
      .x-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .x-ring circle { fill: none; stroke-width: 7; }
      .x-ring .x-ring__track { stroke: var(--stroke-primary); }
      .x-ring .x-ring__bar { stroke: var(--fill-system-green); stroke-linecap: round; transition: stroke-dashoffset 700ms var(--ease-out); }
      .x-ring__num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-variant-numeric: tabular-nums; }
      .x-ring__pct { font: var(--type-heading); font-weight: var(--weight-medium); line-height: 1; }
      .x-ring__frac { font: var(--type-caption); color: var(--text-secondary); line-height: 1.2; }

      .x-sec { display: grid; gap: 10px; }
      .x-sec__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: var(--tap); }
      .x-sec__title { font: var(--type-label); color: var(--text-secondary); }
      .x-fold { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0; border: 0; background: none; color: var(--text-secondary); font: var(--type-label); cursor: pointer; }
      .x-fold svg { width: 16px; height: 16px; transition: transform var(--dur-quick) var(--ease-out); }
      .x-fold[aria-expanded="false"] svg { transform: rotate(-90deg); }
      .x-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }

      .x-task { position: relative; display: flex; align-items: flex-start; gap: 4px; padding: 10px 4px 10px 6px; border-radius: var(--r-m); background: var(--fill-tertiary); transition: opacity 400ms var(--ease-out), transform 400ms var(--ease-out); }
      .x-task.is-leaving { opacity: 0; transform: translateX(16px); }
      .x-check { flex: none; width: var(--tap); height: var(--tap); display: grid; place-items: center; border: 0; background: none; cursor: pointer; padding: 0; }
      .x-check span { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--stroke-primary); display: grid; place-items: center; transition: background var(--dur-quick) ease, box-shadow var(--dur-quick) ease, transform 300ms var(--ease-out); }
      .x-check:hover span { box-shadow: inset 0 0 0 2px var(--text-secondary); }
      .x-check svg { width: 14px; height: 14px; color: #fff; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 360ms var(--ease-out) 80ms; }
      .x-task.is-done .x-check span, .x-task.is-checking .x-check span { background: var(--fill-system-green); box-shadow: none; }
      .x-task.is-checking .x-check span { animation: x-pop 420ms var(--ease-out); }
      .x-task.is-done .x-check svg, .x-task.is-checking .x-check svg { stroke-dashoffset: 0; }
      @keyframes x-pop { 0% { transform: scale(0.8); } 55% { transform: scale(1.12); } 100% { transform: scale(1); } }
      .x-task__body { flex: 1; min-width: 0; padding-top: 11px; display: grid; gap: 6px; }
      .x-task__title { font: var(--type-body-strong); overflow-wrap: anywhere; transition: color var(--dur-quick) ease; }
      .x-task.is-done .x-task__title { color: var(--text-secondary); text-decoration: line-through; text-decoration-color: var(--stroke-primary); }
      .x-task__meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .x-task__note { font: var(--type-small); color: var(--text-secondary); overflow-wrap: anywhere; }
      .x-task__more { flex: none; width: var(--tap); height: var(--tap); display: grid; place-items: center; border: 0; border-radius: 50%; background: none; color: var(--text-secondary); font: var(--type-heading); cursor: pointer; line-height: 1; }
      .x-task__more:hover { background: var(--hover-wash); }
      .x-menu { position: absolute; right: 8px; top: 52px; z-index: 5; min-width: 128px; padding: 6px; border-radius: var(--r-s); background: var(--mat-agent); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur); border: 1px solid var(--stroke-primary); box-shadow: var(--hark-shadow); display: grid; }
      .x-menu[hidden] { display: none; }
      .x-menu button { min-height: var(--tap); padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--text-primary); font: var(--type-small); text-align: left; cursor: pointer; }
      .x-menu button:hover { background: var(--hover-wash); }

      .x-empty { padding: 36px 24px; border-radius: var(--r-l); border: 1px dashed var(--stroke-primary); text-align: center; display: grid; gap: 8px; justify-items: center; }
      .x-empty__icon { font-size: 28px; }
      .x-empty p { font: var(--type-body); color: var(--text-secondary); }

      .x-weekbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .x-weekbar__label { font: var(--type-body-strong); }
      .x-weekbar__nav { display: flex; gap: 6px; }
      .x-strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px; margin: -2px; }
      .x-strip::-webkit-scrollbar { display: none; }
      .x-day { flex: 1 0 48px; scroll-snap-align: start; display: grid; justify-items: center; gap: 4px; padding: 10px 0 8px; min-height: 76px; border: 0; border-radius: var(--r-m); background: var(--fill-tertiary); color: var(--text-primary); cursor: pointer; }
      .x-day__wd { font: var(--type-caption); color: var(--text-secondary); }
      .x-day__n { font: var(--type-body-strong); }
      .x-day__dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
      .x-day.has-tasks .x-day__dot { background: var(--text-secondary); }
      .x-day.is-today .x-day__n { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
      .x-day[aria-pressed="true"] { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-day[aria-pressed="true"] .x-day__wd { color: var(--text-secondary-on); }
      .x-day[aria-pressed="true"] .x-day__dot { background: var(--text-primary-on); }
      .x-day.is-past:not([aria-pressed="true"]) { opacity: 0.6; }

      .x-tabbar { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 30; width: min(100%, 420px); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--mat-agent); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur); border-top: 1px solid var(--stroke-secondary); }
      .x-tab { display: grid; justify-items: center; gap: 2px; min-height: 56px; padding: 6px 0; border: 0; background: none; color: var(--text-secondary); font: var(--type-tag); cursor: pointer; }
      .x-tab svg { width: 22px; height: 22px; }
      .x-tab__ico { display: grid; place-items: center; width: 56px; height: 30px; border-radius: var(--r-pill); transition: background var(--dur-quick) ease; }
      .x-tab[aria-selected="true"] { color: var(--text-primary); }
      .x-tab[aria-selected="true"] .x-tab__ico { background: var(--fill-tertiary); }
      .x-tab:disabled { cursor: default; opacity: 0.55; }
      .x-tab small { font-size: 10px; display: none; }
      .x-fab { position: fixed; z-index: 31; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); right: max(16px, calc(50% - 210px + 16px)); width: 58px; height: 58px; border: 0; border-radius: 20px; background: var(--fill-primary); color: var(--text-primary-on); box-shadow: var(--hark-shadow); display: grid; place-items: center; cursor: pointer; transition: transform var(--dur-quick) var(--ease-out); }
      .x-fab:active { transform: scale(0.94); }
      .x-fab[hidden] { display: none; }
      .x-fab svg { width: 24px; height: 24px; }

      .x-scrim { position: fixed; inset: 0; z-index: 40; background: rgb(29 29 31 / 0.32); opacity: 0; pointer-events: none; transition: opacity 260ms ease; }
      .x-scrim.is-open { opacity: 1; pointer-events: auto; }
      .x-sheet { position: fixed; left: 50%; bottom: 0; z-index: 41; width: min(100%, 420px); max-height: 90dvh; overflow-y: auto; transform: translate(-50%, 105%); transition: transform 360ms var(--ease-out); padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--fill-primary-on); box-shadow: var(--hark-shadow); display: grid; gap: 18px; }
      .x-sheet { visibility: hidden; transition: transform 360ms var(--ease-out), visibility 0s linear 360ms; }
      .x-sheet.is-open { transform: translate(-50%, 0); visibility: visible; transition: transform 360ms var(--ease-out), visibility 0s; }
      .x-sheet__grip { width: 36px; height: 4px; border-radius: 4px; background: var(--stroke-primary); justify-self: center; }
      .x-sheet h2 { font: var(--type-heading); }
      .x-field { display: grid; gap: 8px; }
      .x-field > span { font: var(--type-label); color: var(--text-secondary); }
      .x-input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid transparent; border-radius: var(--r-s); background: var(--fill-tertiary); color: var(--text-primary); font: var(--type-body); font-size: 16px; }
      .x-input:focus { outline: none; border-color: var(--text-secondary); }
      .x-input:disabled { opacity: 0.45; }
      textarea.x-input { min-height: 80px; resize: vertical; }
      .x-hint { font: var(--type-small); color: var(--text-secondary); }
      .x-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); }
      .x-row__label { font: var(--type-body-strong); }
      .x-row__label small { display: block; font: var(--type-small); color: var(--text-secondary); margin-top: 2px; }
      .x-switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 52px; height: 32px; margin: 6px 0; border-radius: var(--r-pill); background: var(--stroke-primary); cursor: pointer; transition: background var(--dur-quick) ease; }
      .x-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.2); transition: transform 220ms var(--ease-out); }
      .x-switch:checked { background: var(--fill-system-green); }
      .x-switch:checked::after { transform: translateX(20px); }
      .x-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .x-actions .btn { justify-content: center; min-height: 48px; font: var(--type-label); }
      .x-primary { min-height: 48px; border: 0; border-radius: var(--r-s); background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-label); cursor: pointer; }
      .x-note { padding: 14px 16px; border-radius: var(--r-m); background: var(--fill-tertiary); font: var(--type-small); color: var(--text-secondary); }

      .x-toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 50; width: min(calc(100% - 24px), 396px); transform: translate(-50%, -140%); transition: transform 420ms var(--ease-out); display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: var(--r-l); background: var(--mat-agent); -webkit-backdrop-filter: var(--hark-blur); backdrop-filter: var(--hark-blur); border: 1px solid var(--stroke-primary); box-shadow: var(--hark-shadow); }
      .x-toast.is-open { transform: translate(-50%, 0); }
      .x-toast__ico { font-size: 22px; flex: none; }
      .x-toast__text { flex: 1; min-width: 0; }
      .x-toast__title { font: var(--type-body-strong); overflow-wrap: anywhere; }
      .x-toast__sub { font: var(--type-small); color: var(--text-secondary); margin-top: 2px; }
      .x-toast .btn { flex: none; min-height: 48px; min-width: 64px; justify-content: center; }

      /* Eisenhower quadrants */
      .x-q1 { --q: color-mix(in srgb, var(--fill-system-orange) 45%, var(--chart-7)); }
      .x-q2 { --q: color-mix(in srgb, var(--chart-1) 78%, var(--text-primary)); }
      .x-q3 { --q: var(--chart-5); }
      .x-q4 { --q: var(--chart-2); }
      .x-task::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 0 4px 4px 0; background: var(--q, transparent); }
      .x-task.is-done::before { opacity: 0.4; }
      .x-qtag { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 8px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--q) 26%, transparent); color: var(--text-primary); font: var(--type-tag); }
      .x-task.is-done .x-qtag { opacity: 0.6; }
      .x-legend { display: flex; flex-wrap: nowrap; gap: 10px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; font: var(--type-caption); color: var(--text-secondary); }
      .x-legend::-webkit-scrollbar { display: none; }
      .x-legend span { flex: none; display: inline-flex; align-items: center; gap: 4px; }
      .x-legend span::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--q); }
      .x-sec__sub { font: var(--type-caption); color: var(--text-secondary); }

      /* compact task tiles */
      .x-tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
      .x-tgrid .x-task { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-content: start; gap: 0; min-height: 76px; padding: 6px 0 10px 0; border-radius: var(--r-s); box-shadow: inset 0 4px 0 var(--q); }
      .x-tgrid .x-task::before { display: none; }
      .x-tgrid .x-task.is-done { box-shadow: inset 0 4px 0 color-mix(in srgb, var(--q) 40%, transparent); }
      .x-tgrid .x-check { width: var(--tap); height: var(--tap); }
      .x-tgrid .x-task__body { margin-left: -4px; }
      .x-tgrid .x-check span { width: 22px; height: 22px; }
      .x-tgrid .x-check svg { width: 12px; height: 12px; }
      .x-tgrid .x-task__body { padding: 12px 34px 0 0; gap: 6px; }
      .x-tgrid .x-task__title { font: var(--type-label); font-weight: var(--weight-medium); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .x-tgrid .x-task__meta { gap: 4px; }
      .x-tgrid .x-task__meta .chip { font: var(--type-caption); }
      .x-tbell { font: var(--type-caption); color: var(--text-secondary); white-space: nowrap; }
      .x-tgrid .x-task__more { position: absolute; top: 2px; right: 0; font: var(--type-label); font-weight: var(--weight-bold); }
      .x-tgrid .x-menu { top: 42px; right: 4px; max-width: 220px; }
      .x-menu__note { margin: 0 0 4px; padding: 8px 12px; border-bottom: 1px solid var(--stroke-secondary); font: var(--type-caption); color: var(--text-secondary); overflow-wrap: anywhere; white-space: pre-wrap; }

      /* priority picker */
      .x-quad { border: 0; margin: 0; padding: 0; min-width: 0; }
      .x-quad legend { padding: 0; margin-bottom: 8px; font: var(--type-label); color: var(--text-secondary); }
      .x-quad__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .x-quad label { position: relative; cursor: pointer; }
      .x-quad input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
      .x-quad__opt { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 10px 12px; border-radius: var(--r-s); background: var(--fill-tertiary); font: var(--type-label); color: var(--text-primary); box-shadow: inset 4px 0 0 var(--q); transition: background var(--dur-quick) ease, box-shadow var(--dur-quick) ease; }
      .x-quad input:checked + .x-quad__opt { background: color-mix(in srgb, var(--q) 24%, var(--fill-tertiary)); box-shadow: inset 0 0 0 2px var(--q); }
      .x-quad input:focus-visible + .x-quad__opt { outline: 2px solid var(--fill-primary); outline-offset: 2px; }
      .x-quad__axis { font: var(--type-caption); color: var(--text-secondary); margin-top: 6px; }
      .x-seg { display: flex; flex-wrap: wrap; gap: 6px; }
      .x-seg__opt { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap); padding: 0 14px; border-radius: var(--r-pill); background: var(--fill-tertiary); font: var(--type-label); color: var(--text-primary); transition: background var(--dur-quick) ease, color var(--dur-quick) ease; }
      .x-quad input:checked + .x-seg__opt { background: var(--fill-primary); color: var(--text-primary-on); }
      .x-quad input:focus-visible + .x-seg__opt { outline: 2px solid var(--fill-primary); outline-offset: 2px; }
      .x-wdays { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
      .x-wdays .x-seg__opt { padding: 0; }
      .x-wdays[hidden], #f-until-wrap[hidden] { display: none; }
      .x-trep { font-size: 12px; line-height: 1; }
      .x-choices { display: grid; gap: 10px; }
      .x-choices .btn { justify-content: center; min-height: 48px; font: var(--type-label); }

      /* month view */
      .x-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 2px; }
      .x-cal__wd { text-align: center; font: var(--type-caption); color: var(--text-secondary); padding-bottom: 4px; }
      .x-mday { display: grid; place-items: center; height: 50px; min-width: 0; padding: 0; border: 0; border-radius: var(--r-s); background: none; color: var(--text-primary); cursor: pointer; }

      /* week strip rings */

      /* tab bar with five tabs */

      /* goals */

      .x-goal__done { flex: none; display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 6px; font: var(--type-label); color: var(--text-primary); gap: 6px; }
      .x-goal__done i { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--fill-system-green); color: #fff; }
      .x-goal__done svg { width: 12px; height: 12px; }
      .x-goal .x-primary { flex: none; min-height: var(--tap); padding: 0 18px; border-radius: var(--r-pill); }
      .x-bar { display: grid; gap: 8px; width: 100%; padding: 6px 0 2px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; border-radius: var(--r-s); }
      .x-bar:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: 4px; }

      .x-bar__today { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: color-mix(in srgb, var(--fill-system-green) 55%, var(--fill-primary-on)); transition: left 600ms var(--ease-out), width 600ms var(--ease-out); }
      .x-bar__meta { display: flex; justify-content: space-between; gap: 8px; font: var(--type-small); color: var(--text-secondary); }
      .x-bar__meta span:last-child { white-space: nowrap; }

      /* goals in the habits tab: compact rows with a small ring */
      .x-glist { display: grid; margin: 0; padding: 4px; list-style: none; border-radius: var(--r-l); background: var(--fill-tertiary); }
      .x-glist li + li { border-top: 1px solid var(--stroke-secondary); }
      .x-grow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 12px; border: 0; border-radius: var(--r-m); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }

      .x-grow__txt { flex: 1; min-width: 0; display: grid; gap: 2px; }

      .x-gring { flex: none; position: relative; width: 44px; height: 44px; display: grid; place-items: center; }

      .x-lhead { display: flex; align-items: center; gap: 14px; }
      .x-lhead__big { font: var(--type-heading); }
      .x-lhead__sub { font: var(--type-small); color: var(--text-secondary); }
      .x-stepper { display: flex; align-items: center; gap: 8px; }

      .x-undo { justify-content: center; min-height: 48px; width: 100%; font: var(--type-label); margin-bottom: -8px; }
      .x-minor { display: flex; justify-content: center; gap: 8px; margin-top: -6px; }
      #log-sheet [hidden] { display: none; }
      .x-minor button { min-height: var(--tap); padding: 0 14px; border: 0; border-radius: var(--r-s); background: none; color: var(--text-secondary); font: var(--type-small); cursor: pointer; }

      /* interval habits */
      .x-hgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
      .x-habit { position: relative; display: grid; gap: 10px; min-width: 0; padding: 16px 12px 12px; border-radius: var(--r-l); background: var(--fill-tertiary); }
      .x-habit > .x-task__more { position: absolute; top: 2px; right: 2px; }

      .x-habit__emoji { font-size: 16px; line-height: 1; }
      .x-habit__body { display: grid; justify-items: center; gap: 10px; }
      .x-hring { flex: none; position: relative; width: 72px; height: 72px; }

      .x-hring circle { fill: none; stroke-linecap: round; }
      .x-hring__track { stroke: var(--stroke-primary); }

      .x-habit__label { display: flex; align-items: center; justify-content: center; gap: 5px; max-width: 100%; font: var(--type-label); overflow-wrap: anywhere; }
      .x-habit__sub { font: var(--type-caption); color: var(--text-secondary); }

      .x-hist { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center; padding-top: 10px; border-top: 1px solid var(--stroke-secondary); font: var(--type-caption); color: var(--text-secondary); }

      .x-mhost { position: relative; }

      /* achievements wall */
      .x-wall { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; padding: 6px 2px 10px; }
      .x-wall__col { display: grid; gap: 18px; min-width: 0; }
      .x-wall__col:nth-child(2) { padding-top: 26px; }
      .x-win { position: relative; display: grid; gap: 8px; padding: 18px 12px 12px; border-radius: 6px; background: color-mix(in srgb, var(--w, var(--chart-1)) 22%, var(--fill-primary-on)); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08), 0 8px 22px -8px rgb(0 0 0 / 0.22); transform: rotate(var(--rot, 0deg)); transition: transform var(--dur-quick) var(--ease-out); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      .x-win::before { content: ""; position: absolute; top: -9px; left: 50%; width: 58px; height: 20px; transform: translateX(-50%) rotate(var(--tape, -4deg)); background: color-mix(in srgb, var(--fill-primary-on) 55%, transparent); border: 1px solid color-mix(in srgb, var(--text-primary) 8%, transparent); box-shadow: 0 1px 2px rgb(0 0 0 / 0.06); }
      .x-win.is-big { padding: 20px 14px 14px; }

      .x-win__text { font: var(--type-small); color: var(--text-primary); overflow-wrap: anywhere; white-space: pre-wrap; }
      .x-win__photo { display: block; width: 100%; padding: 0; border: 4px solid var(--fill-primary-on); border-radius: 3px; background: var(--fill-primary-on); cursor: zoom-in; box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
      .x-win__photo img { display: block; width: 100%; max-height: 220px; object-fit: cover; }
      .x-win .x-task__more { position: absolute; top: 4px; right: 2px; }
      .x-win__text a { color: inherit; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
      .x-win__link { justify-self: start; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; padding: 6px 12px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--fill-primary-on) 70%, transparent); border: 1px solid var(--stroke-secondary); color: var(--text-primary); font: var(--type-tag); text-decoration: none; position: relative; }
      .x-win__link::after { content: ""; position: absolute; inset: -6px 0; }
      .x-win__link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .x-win .x-menu { top: 44px; }
      .x-lightbox { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgb(0 0 0 / 0.88); opacity: 0; pointer-events: none; transition: opacity 240ms ease; cursor: zoom-out; border: 0; width: 100%; }

      .x-lightbox p { position: absolute; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); text-align: center; font: var(--type-small); color: #f5f5f7; }
      .x-photo-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

      .x-photo-btns input { position: absolute; width: 1px; height: 1px; opacity: 0; }
      .x-photo-btns label:focus-within { outline: 2px solid var(--fill-primary); outline-offset: 2px; }
      .x-preview { position: relative; justify-self: start; }
      .x-preview img { display: block; max-width: 100%; max-height: 180px; border-radius: var(--r-s); }
      .x-preview button { position: absolute; top: 6px; right: 6px; width: var(--tap); height: var(--tap); border: 0; border-radius: 50%; background: rgb(0 0 0 / 0.6); color: #fff; cursor: pointer; font: var(--type-label); }
      .x-twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .x-sec__head .btn { min-height: var(--tap); }

      /* habit card: history folds out on tap */
      .x-habit[data-act] { cursor: pointer; }
      .x-habit:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: 2px; }
      .x-hist[hidden] { display: none; }
      .x-habit__more { font: var(--type-caption); color: var(--text-secondary); }

      /* today: goal tiles */

      .x-gtile__main { display: grid; justify-items: center; align-content: start; gap: 2px; width: 100%; padding: 16px 12px 14px; border: 0; border-radius: inherit; background: none; color: inherit; font: inherit; text-align: center; cursor: pointer; }
      .x-gtile__ring { width: 72px; height: 72px; margin-bottom: 8px; }

      .x-gtile__main:hover { box-shadow: inset 0 0 0 100px var(--hover-wash); }
      .x-gtile__main:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: 2px; }
      .x-gtile__name { font: var(--type-body-strong); overflow-wrap: anywhere; }

      /* interval-habit status strip on 今天 */
      .x-hstrip { display: flex; gap: 8px; min-width: 0; padding: 2px; margin: -2px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .x-hstrip::-webkit-scrollbar { display: none; }
      .x-hpill { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 12px 0 8px; border: 1px solid var(--stroke-secondary); border-radius: var(--r-pill); background: none; color: var(--text-secondary); font: var(--type-small); white-space: nowrap; cursor: pointer; }
      .x-hpill:hover { background: var(--hover-wash); }
      .x-hpill:focus-visible { outline: 2px solid var(--fill-primary); outline-offset: 2px; }
      .x-hpill b { font-weight: var(--weight-medium); color: var(--text-primary); }
      .x-hring--xs { width: 28px; height: 28px; }
      .x-habit.is-flash { animation: x-flash 1.6s var(--ease-out); }
      @keyframes x-flash { 0%, 40% { box-shadow: inset 0 0 0 2px var(--text-primary); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
      .x-gtile .x-task__more { position: absolute; top: 2px; right: 2px; }

      .x-gtile.is-met .x-gtile__name { text-decoration: line-through; text-decoration-color: var(--stroke-primary); }
      .x-gall { padding: 14px 16px; border-radius: var(--r-m); background: var(--fill-tertiary); font: var(--type-label); color: var(--text-secondary); }

      /* review: compact calendar, card deck, mood picker */

      .x-deck .x-rcard { cursor: pointer; box-shadow: var(--hark-shadow); transition: transform 260ms var(--ease-out), opacity 260ms var(--ease-out); }
      .x-rcard.is-out-l { transform: translateX(-110%) rotate(-6deg); opacity: 0; }
      .x-rcard.is-out-r { transform: translateX(110%) rotate(6deg); opacity: 0; }
      .x-rcard__top { display: flex; align-items: center; gap: 12px; }
      .x-rcard__top > div { flex: 1; min-width: 0; }
      .x-rcard__date { font: var(--type-body-strong); }
      .x-rcard__stat { font: var(--type-small); color: var(--text-secondary); margin-top: 2px; }
      .x-rcard__mood { flex: none; font-size: 28px; line-height: 1; }
      .x-rring { flex: none; display: grid; place-items: center; width: 44px; height: 44px; }
      .x-rring > * { grid-area: 1 / 1; }
      .x-rring svg { width: 44px; height: 44px; transform: rotate(-90deg); }
      .x-rring circle { fill: none; stroke-width: 4; }
      .x-rring__t { stroke: var(--stroke-primary); }

      .x-rring b { font: var(--type-caption); font-weight: var(--weight-medium); }
      .x-rcard dl { display: grid; gap: 10px; margin: 0; }
      .x-rcard dt { font: var(--type-caption); color: var(--text-secondary); }
      .x-rcard dd { margin: 2px 0 0; font: var(--type-body); overflow-wrap: anywhere; white-space: pre-wrap; }
      /* that day's review, compact, in the day view */
      .x-drev { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px 14px; border-radius: var(--r-m); background: var(--fill-tertiary); border: 0; color: inherit; text-align: left; cursor: pointer; }

      .x-deckbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

      .x-moods { display: flex; flex-wrap: wrap; gap: 8px; }
      .x-mood { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--fill-tertiary); font-size: 24px; transition: box-shadow var(--dur-quick) ease; }

      /* ---------- interaction motion ---------- */
      :root { --x-spring: cubic-bezier(.34, 1.56, .64, 1); --x-dim: .95; }

        --gl-edge: inset 0 1px 0 rgba(255,255,255,.42), inset 0 0 0 1px rgba(255,255,255,.14), inset 0 -10px 22px -14px rgba(255,255,255,.18), 0 10px 30px -8px rgba(0,0,0,.45);
      }
      @media (prefers-color-scheme: dark) { :root.rs-glass:not([data-theme="light"]) {
        --gl-bg: rgba(255,255,255,.10); --gl-bg2: rgba(255,255,255,.14);
        --gl-blur: blur(26px) saturate(175%) brightness(1.06);
        --gl-edge: inset 0 1px 0 rgba(255,255,255,.42), inset 0 0 0 1px rgba(255,255,255,.14), inset 0 -10px 22px -14px rgba(255,255,255,.18), 0 10px 30px -8px rgba(0,0,0,.45);
      } }
      :root.rs-glass .x-tabbar, :root.rs-glass .x-menu { -webkit-backdrop-filter: blur(30px) saturate(200%) brightness(1.08); backdrop-filter: blur(30px) saturate(200%) brightness(1.08); }
      :root.rs-glass .x-sheet, :root.rs-glass .rsx__card { -webkit-backdrop-filter: blur(34px) saturate(200%) brightness(1.08); backdrop-filter: blur(34px) saturate(200%) brightness(1.08); }
      :root.rs-glass[data-theme="dark"] .x-sheet, :root.rs-glass[data-theme="dark"] .rsx__card { background: rgba(30,30,36,.55) !important; }
      @media (prefers-color-scheme: dark) { :root.rs-glass:not([data-theme="light"]) .x-sheet, :root.rs-glass:not([data-theme="light"]) .rsx__card { background: rgba(30,30,36,.55) !important; } }
      /* 照片背景太碎时玻璃会糊成一团：给照片本身轻微虚化 */
      :root.rs-glass.rs-bgimg #rs-bglayer { filter: blur(6px) saturate(115%); inset: -14px; }
      :root.rs-glass .x-hello, :root.rs-glass .x-sec__title, :root.rs-glass .x-date { text-shadow: 0 1px 8px rgba(0,0,0,.12); }
    </style>
  </head>
  <body>
    <div class="page" id="top">
      <main class="main x-app">
        <header class="x-top">
          <div class="x-top__text">
            <p class="x-top__date" id="top-date"></p>
            <h1 id="top-title"></h1>
            <p class="x-top__line" id="top-line"></p>
          </div>
          <div class="x-top__prog" id="top-prog" hidden></div>
          <button class="x-icon-btn" id="open-timer" type="button" aria-label="计时"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.5h5M12 2.5V6M18.5 6.5l1.5-1.5"/></svg></button>
          <button class="x-icon-btn" id="open-settings" type="button" aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </header>

        <div id="view-today" role="tabpanel" aria-label="今天" style="display:grid;gap:20px"></div>
        <div id="view-plan" role="tabpanel" aria-label="计划" style="display:none;gap:20px"></div>
        <div id="view-habits" role="tabpanel" aria-label="习惯" style="display:none;gap:20px"></div>
        <div id="view-wins" role="tabpanel" aria-label="成果" style="display:none;gap:20px"></div>
        <div id="view-review" role="tabpanel" aria-label="复盘" style="display:none;gap:20px"></div>
      </main>

      <button class="x-fab" id="fab" type="button" aria-label="添加任务">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <nav class="x-tabbar" role="tablist" aria-label="主导航">
        <button class="x-tab" role="tab" data-tab="today" aria-selected="true" type="button">
          <span class="x-tab__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>今天
        </button>
        <button class="x-tab" role="tab" data-tab="plan" aria-selected="false" type="button">
          <span class="x-tab__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span>计划
        </button>
        <button class="x-tab" role="tab" data-tab="habits" aria-selected="false" type="button">
          <span class="x-tab__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>习惯
        </button>
        <button class="x-tab" role="tab" data-tab="wins" aria-selected="false" type="button">
          <span class="x-tab__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg></span>成果
        </button>
        <button class="x-tab" role="tab" data-tab="review" aria-selected="false" type="button">
          <span class="x-tab__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 11h6M9 14.5h6M9 18h3.5"/></svg></span>复盘
        </button>
      </nav>

      <div class="x-scrim" id="scrim"></div>

      <section class="x-sheet" id="task-sheet" role="dialog" aria-modal="true" aria-labelledby="task-sheet-title" aria-hidden="true">
        <div class="x-sheet__grip"></div>
        <h2 id="task-sheet-title">添加任务</h2>
        <form id="task-form" novalidate style="display:grid;gap:18px">
          <label class="x-field"><span>任务名称</span>
            <input class="x-input" id="f-title" type="text" maxlength="60" placeholder="比如：散步 10 分钟" autocomplete="off" />
            <p class="x-hint" id="f-title-hint" hidden>给任务起个名字吧，一两个字也可以。</p>
          </label>
          <label class="x-field"><span>日期</span>
            <input class="x-input" id="f-date" type="date" />
          </label>
          <fieldset class="x-quad">
            <legend>重复</legend>
            <div class="x-seg">
              <label><input type="radio" name="f-rep" value="none" checked /><span class="x-seg__opt">不重复</span></label>
              <label><input type="radio" name="f-rep" value="daily" /><span class="x-seg__opt">每天</span></label>
              <label><input type="radio" name="f-rep" value="weekday" /><span class="x-seg__opt">工作日</span></label>
              <label><input type="radio" name="f-rep" value="weekly" /><span class="x-seg__opt">每周…</span></label>
              <label><input type="radio" name="f-rep" value="monthly" /><span class="x-seg__opt">每月</span></label>
            </div>
            <div class="x-wdays" id="f-wdays" role="group" aria-label="每周哪几天" hidden>
              <label><input type="checkbox" name="f-wd" value="1" aria-label="周一" /><span class="x-seg__opt" aria-hidden="true">一</span></label>
              <label><input type="checkbox" name="f-wd" value="2" aria-label="周二" /><span class="x-seg__opt" aria-hidden="true">二</span></label>
              <label><input type="checkbox" name="f-wd" value="3" aria-label="周三" /><span class="x-seg__opt" aria-hidden="true">三</span></label>
              <label><input type="checkbox" name="f-wd" value="4" aria-label="周四" /><span class="x-seg__opt" aria-hidden="true">四</span></label>
              <label><input type="checkbox" name="f-wd" value="5" aria-label="周五" /><span class="x-seg__opt" aria-hidden="true">五</span></label>
              <label><input type="checkbox" name="f-wd" value="6" aria-label="周六" /><span class="x-seg__opt" aria-hidden="true">六</span></label>
              <label><input type="checkbox" name="f-wd" value="0" aria-label="周日" /><span class="x-seg__opt" aria-hidden="true">日</span></label>
            </div>
            <p class="x-quad__axis" id="f-rep-line" hidden></p>
          </fieldset>
          <div class="x-field" id="f-until-wrap" hidden>
            <div class="x-row">
              <label class="x-row__label" for="f-until-on">结束日期<small>默认一直重复</small></label>
              <input class="x-switch" id="f-until-on" type="checkbox" role="switch" />
            </div>
            <input class="x-input" id="f-until" type="date" aria-label="结束日期" disabled />
            <p class="x-hint" id="f-rep-hint" hidden></p>
          </div>
          <fieldset class="x-quad">
            <legend>优先级</legend>
            <div class="x-quad__grid">
              <label class="x-q1"><input type="radio" name="f-q" value="1" /><span class="x-quad__opt">重要且紧急</span></label>
              <label class="x-q2"><input type="radio" name="f-q" value="2" checked /><span class="x-quad__opt">重要不紧急</span></label>
              <label class="x-q3"><input type="radio" name="f-q" value="3" /><span class="x-quad__opt">紧急不重要</span></label>
              <label class="x-q4"><input type="radio" name="f-q" value="4" /><span class="x-quad__opt">不重要不紧急</span></label>
            </div>
            <p class="x-quad__axis">先做重要且紧急的；重要不紧急的，留出固定时间。</p>
          </fieldset>
          <div class="x-field">
            <div class="x-row">
              <label class="x-row__label" for="f-remind">提醒时间<small>到点时轻轻提醒你</small></label>
              <input class="x-switch" id="f-remind" type="checkbox" role="switch" />
            </div>
            <input class="x-input rsx-timein" id="f-time" type="text" readonly inputmode="none" placeholder="选择时间" aria-label="提醒时间" disabled />
          </div>
          <label class="x-field"><span>备注</span>
            <textarea class="x-input" id="f-note" maxlength="200" placeholder="可选，写点给自己的话"></textarea>
          </label>
          <div class="x-actions">
            <button class="btn" type="button" id="f-cancel">取消</button>
            <button class="x-primary" type="submit">保存</button>
          </div>
        </form>
      </section>

      <section class="x-sheet" id="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true">
        <div class="x-sheet__grip"></div>
        <h2 id="settings-title">设置</h2>
        <div class="rs-acct" id="rs-acct">
          <div class="rs-acct__av" id="rs-av">☁</div>
          <div class="rs-acct__t"><b id="rs-acct-name">未登录</b><small id="rs-acct-sub">用邮箱登录，换手机数据不丢</small></div>
          <button class="btn" type="button" id="rs-acct-btn">登录</button>
        </div>
        <div class="x-actions" id="rs-acct-acts" style="display:none">
          <button class="btn" type="button" id="rs-sync-now">立即同步</button>
          <button class="btn" type="button" id="rs-logout">退出登录</button>
        </div>
        <div class="rs-vip" id="rs-vip" style="display:none"><span id="rs-vip-t">云同步</span><button class="btn" type="button" id="rs-vip-btn">输入激活码</button></div>
        <div class="x-row">
          <label class="x-row__label" for="s-notify">开启通知提醒<small id="s-notify-status">到点时在系统通知里提醒</small></label>
          <input class="x-switch" id="s-notify" type="checkbox" role="switch" />
        </div>
        <p class="x-note">到点会发系统通知，锁屏也能收到。</p>
        <div class="x-actions">
          <button class="btn" type="button" id="s-test">试一下提醒</button> <button class="btn" type="button" id="s-nset">通知设置</button>
          <button class="btn" type="button" id="s-reset" style="display:none">恢复演示数据</button>
          <button class="btn" type="button" id="s-clear">清空数据，开始使用</button>
        </div>
        <div class="rs-row-t">数据</div>
        <div class="x-actions">
          <button class="btn" type="button" id="rs-export">导出备份</button>
          <button class="btn" type="button" id="rs-import">导入并合并</button>
        </div>
        <input type="file" id="rs-import-file" accept=".json,application/json,text/plain,*/*" style="display:none" />
        <div class="rs-row-t">外观</div>
        <div class="rs-seg" id="rs-theme" role="radiogroup" aria-label="外观">
          <button type="button" data-t="system">跟随系统</button>
          <button type="button" data-t="light">白天</button>
          <button type="button" data-t="dark">黑夜</button>
        </div>
        <div class="rs-list"><button class="rs-li" type="button" id="rs-open-fx"><span>🔔 音效与动画</span><span>音效 · 震动 · 庆祝 ›</span></button></div>
        <div class="rs-list"><button class="rs-li" type="button" id="rs-open-skin"><span>✨ 个性化外观</span><span>背景 · 主题色 ›</span></button></div>
        <div class="rs-list"><button class="rs-li" type="button" id="rs-open-about"><span>关于软件</span><span>v0.5.13 ›</span></button></div>
        <button class="x-primary" type="button" id="s-close">完成</button>
      </section>

      <section class="x-sheet" id="login-sheet" role="dialog" aria-modal="true" aria-labelledby="login-title" aria-hidden="true">
        <div class="x-sheet__grip"></div>
        <h2 id="login-title">邮箱登录</h2>
        <p style="font-size:14px;opacity:.7;margin-top:-8px">没有账号会自动注册。登录后数据自动备份到云端。</p>
        <input class="rs-in" id="rs-email" type="email" inputmode="email" autocomplete="email" placeholder="你的邮箱，比如 abc@qq.com" />
        <div class="rs-code">
          <input class="rs-in" id="rs-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码" />
          <button class="btn" type="button" id="rs-send">获取验证码</button>
        </div>
        <p class="rs-err" id="rs-err"></p>
        <button class="x-primary" type="button" id="rs-login">登录</button>
      </section>

      <section class="x-sheet" id="about-sheet" role="dialog" aria-modal="true" aria-labelledby="about-title" aria-hidden="true">
        <div class="x-sheet__grip"></div>
        <div class="rs-about">
          <img class="rs-about__logo" src="logo.png" alt="人生更新" />
          <h2 class="rs-about__name" id="about-title">人生更新</h2>
          <p class="rs-about__ver">版本 0.5.13</p>
          <p style="font-size:14px;opacity:.75;margin-top:4px">把今天要做的事，一件件做完。</p>
        </div>
        <div class="rs-list">
          <button class="rs-li" type="button" id="rs-upd"><span>检查更新</span><span>›</span></button>
          <div class="rs-li"><span>开发者</span><span>六三五</span></div>
          <button class="rs-li" type="button" id="rs-xhs"><span>官方小红书</span><span>95947616004 · 复制</span></button>
        </div>
        <p style="font-size:12px;opacity:.5;text-align:center">有建议或遇到问题，欢迎来小红书留言</p>
        <button class="x-primary" type="button" data-close>好的</button>
      </section>

      <section class="x-sheet" id="goal-sheet" role="dialog" aria-modal="true" aria-labelledby="goal-sheet-title" aria-hidden="true">
        <div class="x-sheet__grip"></div>
        <h2 id="goal-sheet-title">新目标计划</h2>
        <form id="goal-form" novalidate style="display:grid;gap:18px">
          <label class="x-field"><span>目标名称</span>
            <input class="x-input" id="g-name" type="text" maxlength="30" placeholder="比如：背单词" autocomplete="off" />
            <p class="x-hint" id="g-name-hint" hidden>给目标起个名字吧。</p>
          </label>
          <div class="x-twocol">
            <label class="x-field"><span>总量</span>
              <input class="x-input" id="g-total" type="number" inputmode="numeric" min="1" step="1" value="100" />
            </label>
            <label class="x-field"><span>单位</span>
              <input class="x-input" id="g-unit" type="text" list="g-units" maxlength="6" value="个" />
              <datalist id="g-units"><option value="个"></option><option value="页"></option><option value="次"></option><option value="分钟"></option><option value="公里"></option></datalist>
            </label>
          </div>
          <div class="x-twocol">
            <label class="x-field"><span>天数</span>
              <input class="x-input" id="g-days" type="number" inputmode="numeric" min="1" step="1" value="30" />
            </label>
            <label class="x-field"><span>开始日期</span>
              <input class="x-input" id="g-start" type="date" />
            </label>
          </div>
          <div class="x-field">
            <span id="g-freq-l">频率</span>
            <select class="x-input" id="g-freq" aria-labelledby="g-freq-l">
              <option value="1">每天</option>
              <option value="2">隔 1 天</option>
              <option value="3">隔 2 天</option>
              <option value="c">自定义（每 N 天）</option>
            </select>
            <input class="x-input" id="g-every" type="number" inputmode="numeric" min="2" step="1" value="4" aria-label="每几天一次" hidden />
          </div>
          <p class="x-note" id="g-preview"></p>
          <div class="x-actions">
            <button class="btn" type="button" data-close>取消</button>
            <button class="x-primary" type="submit">保存</button>
          </div>
        </form>
      </section>

      <section class="x-sheet" id="log-sheet" role="dialog" aria-modal="true" aria-labelledby="log-sheet-title" aria-hidden="true">
        <div class="x-sheet__grip"></div>
        <h2 id="log-sheet-title">今天完成了多少</h2>
        <form id="log-form" novalidate style="display:grid;gap:18px">
          <div class="x-lhead">
            <div class="x-gring x-gring--lg" id="log-ring"></div>
            <div><p class="x-lhead__big" id="log-quota"></p><p class="x-lhead__sub" id="log-meta"></p></div>
          </div>
          <div class="x-field" id="log-field">
            <span id="log-label">今天实际完成</span>
            <div class="x-stepper">
              <button class="x-stepper__btn" type="button" data-step="-1" aria-label="减 1">−</button>
              <input class="x-input" id="log-amt" type="number" inputmode="decimal" min="0" step="any" aria-labelledby="log-label" />
              <span class="x-stepper__unit" id="log-unit">个</span>
              <button class="x-stepper__btn" type="button" data-step="1" aria-label="加 1">+</button>
            </div>
            <div class="x-qchips">
              <button type="button" data-step="5">+5</button>
              <button type="button" data-step="10">+10</button>
            </div>
          </div>
          <p class="x-note" id="log-preview"></p>
          <button class="btn x-undo" type="button" id="log-undo" hidden>撤销今天的完成</button>
          <div class="x-actions">
            <button class="btn" type="button" data-close>取消</button>
            <button class="x-primary" type="submit" id="log-save">保存</button>
          </div>
          <div class="x-minor" id="log-minor">
            <button type="button" id="log-edit">编辑</button>
            <button type="button" id="log-del">删除</button>
          </div>
        </form>
      </section>

      <section class="x-sheet" id="habit-sheet" role="dialog" aria-modal="true" aria-labelledby="habit-sheet-title" aria-hidden="true">
        <div class="x-sheet__grip"></div>
        <h2 id="habit-sheet-title">新间隔习惯</h2>
        <form id="habit-form" novalidate style="display:grid;gap:18px">
          <label class="x-field"><span>想克制的事</span>
            <input class="x-input" id="h-name" type="text" maxlength="20" placeholder="比如：喝奶茶" autocomplete="off" />
            <p class="x-hint" id="h-name-hint" hidden>写下想克制的事，比如“吃炸鸡”。</p>
          </label>
          <div class="x-twocol">
            <label class="x-field"><span>每几天一次</span>
              <input class="x-input" id="h-every" type="number" inputmode="numeric" min="1" step="1" value="7" />
            </label>
            <label class="x-field"><span>图标（可选）</span>
              <input class="x-input" id="h-emoji" type="text" maxlength="4" placeholder="🧋" autocomplete="off" />
            </label>

    <script>
      (function () {

        var store = mkStore(KEY), wstore = mkStore(WKEY);
        // ---------- 0.5 成果照片存 IndexedDB ----------
        // 以前照片和任务一起存在 localStorage（上限约 5MB），照片多了会把空间占满，连任务都存不进去。

        var RsgxPhotos = (function () {

          function tx(mode, fn) {

          function isData(p) { return typeof p === "string" && p.indexOf("data:") === 0; }
          function lsSet(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } }

              return null;
            }).catch(function () {}).then(function () { loaded = true; fill(); if (done) done(); });

          }
          function fill(wins) {

        function pad(n) { return (n < 10 ? "0" : "") + n; }
        function dkey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
        function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
        function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
        function todayKey() { return dkey(new Date()); }
        function label(d) { return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + WD[d.getDay()]; }
        function nowHM() { var n = new Date(); return pad(n.getHours()) + ":" + pad(n.getMinutes()); }
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
        function uid() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

        var QN = { 1: "重要且紧急", 2: "重要不紧急", 3: "紧急不重要", 4: "不重要不紧急" };
        var POOL = [
          ["写周报", 1, "16:00"], ["回复客户邮件", 3, "10:00"],
          ["读书 30 分钟", 2, "21:30"], ["整理发票", 3, "11:30"], ["设备测试报告", 1, "14:00"], ["给家里打电话", 2, "20:00"],
          ["准备周会材料", 1, "09:30"], ["取快递", 3, "18:00"], ["报销差旅费", 3, ""],
          ["冥想 10 分钟", 2, "22:00"], ["清理邮箱订阅", 4, ""], ["学英语 20 分钟", 2, "12:30"], ["预约体检", 1, ""],
          ["买菜", 3, "18:30"], ["整理相册", 4, ""], ["处理客户投诉", 1, "11:00"], ["刷短视频不超过 20 分钟", 4, ""],
          ["整理桌面", 4, ""], ["复盘本周目标", 2, "21:00"]
        ];
        function rng(s) { return function () { s = (s + 0x6d2b79f5) | 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        function seed() {
          var now = new Date(), t = todayKey(), m = dkey(addDays(now, 1));
          function mk(title, date, time, q, done, note) { return { id: uid(), title: title, date: date, time: time || "", note: note || "", q: q, done: !!done, skipped: false, notified: date < t || !!done }; }
          var tasks = [];
          // Every day of this month before today (at least the last week), 3–6 tasks each, varied completion.
          var first = new Date(now.getFullYear(), now.getMonth(), 1), start = addDays(now, -7);
          if (first < start) start = first;
          var past = [];
          for (var d = start; dkey(d) < t; d = addDays(d, 1)) {
            var k = dkey(d), r = rng(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
            var n = 3 + Math.floor(r() * 4), picks = POOL.slice();
            for (var i = picks.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var tmp = picks[i]; picks[i] = picks[j]; picks[j] = tmp; }
            var roll = r(), rate = roll < 0.35 ? 1 : roll < 0.65 ? 0.6 + r() * 0.25 : roll < 0.87 ? 0.5 : r() * 0.3;

          // Keep four recent leftovers open; the rest of the misses are marked skipped so they stay on their own day.
          var kept = 0;

          var s0 = dkey(start);

            mkRule({ title: "晨间散步", time: "07:30", note: "慢慢走，留意呼吸", q: 2 }, s0, { freq: "daily" }),
            mkRule({ title: "做 3 分钟呼吸练习", time: "16:00", note: "吸气 4 秒，呼气 6 秒", q: 2 }, s0, { freq: "weekday" }),
            mkRule({ title: "健身", time: "19:00", note: "", q: 2 }, s0, { freq: "weekly", days: [2, 4, 6] })
          ];
          for (var rd = start; dkey(rd) < t; rd = addDays(rd, 1)) {
            var rk = dkey(rd), rr = rng(rd.getDate() * 7919 + rd.getMonth() * 31 + 17);
            rules.forEach(function (ru) { if (matches(ru, rk)) { var it = inst(ru, rk); it.done = rr() < 0.72; tasks.push(it); } });
          }
          var walk = inst(rules[0], t); walk.done = true; walk.notified = true;
          tasks.push(
            walk,
            mk("写周报", t, "14:30", 1, false, "先列三个要点，再展开"),
            mk("回复客户邮件", t, "10:00", 3, true),
            mk("整理桌面", t, "", 4, false),
            mk("准备周会材料", m, "09:30", 1, false),
            mk("读书 30 分钟", m, "21:30", 2, false)

        }

        // ---------- repeating tasks: a rule, with one instance per matching day made on first view ----------
        var WDN = ["日", "一", "二", "三", "四", "五", "六"];
        function mkRule(f, start, rep) {
          return { id: "r" + uid(), title: f.title, time: f.time || "", note: f.note || "", q: f.q || 2, start: start, until: rep.until || "", freq: rep.freq, days: rep.freq === "weekly" ? (rep.days || []).slice() : [], ex: [] };

        function ruleOf(x) { if (!x || !x.rid || !state.rules) return null; for (var i = 0; i < state.rules.length; i++) if (state.rules[i].id === x.rid) return state.rules[i]; return null; }

        function seedReviews() {
          function r(n, mood, good, improve, focus) { return { id: uid(), date: ago(n), mood: mood, good: good, improve: improve, focus: focus }; }
          return [
            r(1, "😄", "写完了周报，早上散步也坚持了", "下午刷手机有点久", "上午先做设备测试报告"),
            r(2, "🙂", "背了 5 个单词，超额完成", "晚饭后拖了一会儿才开始读书", "9 点前开始读书"),
            r(3, "😐", "客户邮件全部回完了", "冥想跳过了，睡得晚", "11 点前睡觉"),
            r(5, "😄", "跑了 5 公里，状态很好", "午饭吃得太快", "准备好周会材料"),
            r(6, "😕", "至少把发票整理完了", "任务排太满，一半没做完", "只安排 3 件最重要的"),
            r(7, "🙂", "给家里打了电话，聊了很久", "水喝得不够", "早起散步 15 分钟")
